name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
    
    - name: Install dependencies
      run: |
        yarn install --immutable --network-timeout 100000
    
    - name: Setup environment variables
      run: |
        echo "DATABASE_URL=file:./test.db" >> .env
        echo "NEXTAUTH_SECRET=test-secret-for-ci" >> .env
        echo "NEXTAUTH_URL=http://localhost:3000" >> .env
    
    - name: Generate Prisma Client
      run: yarn db:generate
    
    - name: Setup test database
      run: |
        cp prisma/dev.db prisma/test.db || echo "Creating new test database"
        DATABASE_URL="file:./test.db" yarn db:push
    
    - name: Run linter
      run: yarn lint
    
    - name: Run unit tests
      run: yarn test
    
    - name: Build
      run: yarn build
